# Runs the two long-lived processes of the runtime image under one supervisor:
# the FastAPI backend (gunicorn + Uvicorn workers) and nginx. If either exits,
# supervisord's exit event handler tears down the container so Docker restarts it,
# preventing a half-dead state where only one process survives.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Backend API. gunicorn manages WEB_CONCURRENCY Uvicorn workers for parallelism.
[program:backend]
command=gunicorn -c gunicorn_conf.py app.main:app
directory=/app/backend
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Static file server + reverse proxy. Runs in the foreground.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Kills the whole container if any managed process dies, so Docker's restart
# policy can bring back a clean instance instead of a partially-running one.
[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL
command=sh -c "printf 'READY\n' && read line && kill -SIGQUIT $PPID"
