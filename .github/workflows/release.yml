# Manual release workflow: bumps semver, tags, builds native amd64+arm64
# images, merges them into one GHCR multi-arch manifest, and creates a
# GitHub Release. Triggered from Actions → Create Release.
#
# Flow: prepare (version/tag/notes) → build matrix (native per-arch,
# push-by-digest) → merge (imagetools + release).

name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - minor
          - major
        default: minor

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Bumps version files, commits, tags, and uploads release notes for merge.
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      version_number: ${{ steps.version.outputs.version_number }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major: ${{ steps.version.outputs.major }}

    steps:
      # Full history needed for tag detection and changelog generation.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads latest vX.Y.Z and bumps major or minor, resetting lower parts.
      - name: Calculate new version
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          echo "Latest tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          if [ "${{ github.event.inputs.version_bump }}" == "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          else
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "major_minor=${MAJOR}.${MINOR}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT

      # Bumps frontend/package.json, backend/pyproject.toml, and Dockerfile LABEL.
      - name: Update version in codebase
        run: |
          jq '.version = "${{ steps.version.outputs.version_number }}"' frontend/package.json > frontend/package.json.tmp
          mv frontend/package.json.tmp frontend/package.json

          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.version_number }}"/' backend/pyproject.toml

          sed -i 's/LABEL version=".*"/LABEL version="${{ steps.version.outputs.version_number }}"/' docker/Dockerfile

          echo "Updated version in frontend/package.json:"
          grep '"version"' frontend/package.json
          echo ""
          echo "Updated version in backend/pyproject.toml:"
          grep '^version = ' backend/pyproject.toml
          echo ""
          echo "Updated version in docker/Dockerfile:"
          grep 'LABEL version=' docker/Dockerfile

      # No-op if files were already at the target version.
      - name: Commit and push version bump
        run: |
          git config user.name "Aayush Sinha"
          git config user.email "hello@yush.dev"
          git add frontend/package.json backend/pyproject.toml docker/Dockerfile
          if git diff --cached --quiet; then
            echo "Files already at version ${{ steps.version.outputs.version_number }}, skipping commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version_number }}"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          git config user.name "Aayush Sinha"
          git config user.email "hello@yush.dev"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      # Commits since the previous tag become the release notes body.
      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 2 | head -n 1)

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ steps.version.outputs.new_version }}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log ${PREV_TAG}..${{ steps.version.outputs.new_version }} --pretty=format:"- %s (%h)" --no-merges)
          fi

          cat > RELEASE_NOTES.md << EOF
          ## What's Changed

          ${COMMITS}

          ## Docker

          \`\`\`bash
          docker run -d -p 7676:7676 \\
            -e STASH_INTERNAL_URL=http://your-stash-host:9999 \\
            -e STASH_API_KEY=your-api-key \\
            --name stash-hub \\
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.new_version }}
          \`\`\`

          For Docker Compose, use \`docker/docker-compose.example.yaml\`.

          Or pull the image directly:

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.new_version }}
          \`\`\`

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.new_version }}
          EOF

          echo "Release notes generated"

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 1

  # Builds one platform natively per runner and pushes by digest only.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: arm64
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout the tag so the image includes the bumped version LABEL.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.new_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; tags are applied later when digests are merged.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Single-platform native build; digest artifact is consumed by merge.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Stores digest as an empty filename for the merge job to discover.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines per-arch digests into tagged multi-arch manifests and publishes the release.
  merge:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Public tags: latest, vX.Y.Z, vX.Y, vX.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.new_version }}
            type=raw,value=v${{ needs.prepare.outputs.major_minor }}
            type=raw,value=v${{ needs.prepare.outputs.major }}

      # Creates one multi-arch manifest listing both native digests under those tags.
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.new_version }}
          name: ${{ needs.prepare.outputs.new_version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
