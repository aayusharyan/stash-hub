# nginx serves the compiled React SPA and reverse-proxies every /api/* request to
# the FastAPI backend on 127.0.0.1:8000. Media routes disable buffering so large
# video/preview streams pass through with constant memory and correct Range support.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    # Long-lived upstream connections cut TCP handshake overhead under many
    # concurrent streams; keepalive keeps a warm pool open to the backend.
    upstream backend {
        server 127.0.0.1:8000;
        keepalive 64;
    }

    # gzip only text assets; media is already compressed and streamed raw.
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen      7676;
        # HTTP/2 lets the browser multiplex all thumbnail/preview/stream requests
        # over a single connection, removing the ~6-connections-per-host limit that
        # otherwise serialises a media-heavy grid.
        http2       on;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # Hashed build assets are immutable and can be cached aggressively.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Media streaming proxy: buffering must be off so bytes flow straight to
        # the client as the backend receives them, and Range headers survive intact.
        location /api/stash/ {
            proxy_pass                    http://backend;
            proxy_http_version            1.1;
            proxy_set_header Connection   "";
            proxy_set_header Host         $host;
            proxy_set_header X-Real-IP    $remote_addr;
            proxy_set_header Range        $http_range;
            proxy_set_header If-Range     $http_if_range;
            proxy_buffering               off;
            proxy_request_buffering       off;
            proxy_read_timeout            1h;
        }

        # All other API calls (JSON): standard buffered proxying is fine.
        location /api/ {
            proxy_pass                  http://backend;
            proxy_http_version          1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # SPA fallback: unknown paths return index.html so React Router can handle
        # client-side routes like /scenes/123 on a hard refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
